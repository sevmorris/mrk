name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A new push to a pull request cancels the run for the commit before it, which
# nobody would read. Every other run has a group of its own, by run_id, so each
# push to main is tested to the end and none waits for another. repo-standards
# holds every workflow to this (ci-cancel).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  checks:
    # Two legs, on Apple silicon. xcode-27 is the macOS this Mac runs: GitHub
    # offers macOS 27 only under that label, as a public preview with no uptime
    # promise. Move the leg to macos-27 when GitHub adds that label. macos-26 is
    # the newest GA image, and the macOS a new Mac can arrive on, as this one
    # did on 2026-09-15. When this Mac moves to a new major macOS, change the
    # legs in the same session; CLAUDE.md lists what else changes (audit 25).
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, xcode-27]
    runs-on: ${{ matrix.os }}
    # ci-check runs its gates one for each CPU, and takes about 4 minutes on the
    # 3-CPU runner. A hung gate fails here, not after GitHub's 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The Go modules live in tools/*, not at the repo root. setup-go
          # caches by default and looks for ./go.sum, so without this the
          # restore failed every run with "Dependencies file is not found".
          cache-dependency-path: tools/*/go.sum

      # bash: the runner has only macOS's bash 3.2. pushall and mrk-push need 4+
      # and re-exec into Homebrew's, and check-commit-gates runs both — without
      # it that gate dies with "bash 4+ required" before testing anything.
      # gnupg: tests/restore-keys.sh builds and restores a real archive, and the
      # bug it guards against needs GnuPG 2.4.1 or later to show itself.
      - name: Install shellcheck, bash and gnupg
        run: brew install shellcheck bash gnupg

      - name: CI checks
        run: scripts/ci-check

      - name: Go build
        run: make build-tools

  # The ruleset on main requires a check named "test". A matrix names its
  # checks "checks (macos-26)" and "checks (xcode-27)", which that rule would
  # wait for forever, so this job carries the name and passes only when every
  # leg passed. always() makes it report a failed or cancelled leg as a
  # failure, not as a skip, which the rule would count as a pass.
  test:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every leg passed
        run: |
          echo "checks: ${{ needs.checks.result }}"
          [ "${{ needs.checks.result }}" = success ]
