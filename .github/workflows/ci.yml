name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          # The Go modules live in tools/*, not at the repo root. setup-go
          # caches by default and looks for ./go.sum, so without this the
          # restore failed every run with "Dependencies file is not found".
          cache-dependency-path: tools/*/go.sum

      # bash: the runner has only macOS's bash 3.2. pushall and mrk-push need 4+
      # and re-exec into Homebrew's, and check-commit-gates runs both — without
      # it that gate dies with "bash 4+ required" before testing anything.
      # gnupg: tests/restore-keys.sh builds and restores a real archive, and the
      # bug it guards against needs GnuPG 2.4.1 or later to show itself.
      - name: Install shellcheck, bash and gnupg
        run: brew install shellcheck bash gnupg

      - name: CI checks
        run: scripts/ci-check

      - name: Go build
        run: make build-tools
