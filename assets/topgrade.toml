[misc]
assume_yes = true
pre_sudo = true
sudo_command = "sudo"

# Modules you don't want Topgrade to touch
# "system"      = macOS softwareupdate (handled separately)
# "mas"         = mrk does not use mas; App Store apps are installed by hand
#                 (docs/app-store-apps.md)
# "pnpm"        = managed via npm, not standalone
# "pip3"        = Python tools come from pipx, which the pipx step below upgrades
# "node"        = the "npm global update" command below does this with nvm loaded
# "claude_code" = step runs `claude plugin marketplace update`, which grabs the
#                 tty and gets SIGTTOU'd, suspending the whole run; Claude Code
#                 self-updates anyway.
disable = ["system", "mas", "pnpm", "pip3", "node", "claude_code"]

no_retry = true
cleanup = true

# Don't self-update — Homebrew manages the topgrade binary
no_self_update = true

# Only notify at the end, not per-step
notify_each_step = false

[commands]
"npm global update" = "bash -lc 'export NVM_DIR=\"$HOME/.nvm\"; [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; npm update -g'"

[post_commands]
"pipx upgrade-all" = "bash -lc 'command -v pipx >/dev/null && pipx upgrade-all || true'"
# pip says "ERROR: No matching packages" and exits 1 when its cache is already
# empty (pip 21, which /usr/bin/pip3 is and which bash -lc finds), or "WARNING:
# No matching packages" and exits 0 (pip 23 and later). Either way nothing is
# wrong, and the first reads like a failure, so the step says so beneath pip's
# own output. Any other failure gets a line saying it failed. The step exits 0
# whatever pip did, as it always has: a clean-up command that fails makes
# topgrade exit 1 after the whole run.
"pip cache purge" = "bash -lc 'command -v pip3 >/dev/null || exit 0; out=$(pip3 cache purge 2>&1); rc=$?; [ -z \"$out\" ] || echo \"$out\"; case \"$out\" in \"ERROR: No matching packages\"|\"WARNING: No matching packages\"*) echo \"(the pip cache was already empty; this is normal)\" ;; *) [ \"$rc\" -eq 0 ] || echo \"(pip cache purge failed, exit $rc)\" ;; esac; true'"
"Homebrew cache scrub" = "bash -lc 'command -v brew >/dev/null && brew cleanup -s --prune=30 || true'"
"npm cache verify" = "bash -lc 'export NVM_DIR=\"$HOME/.nvm\"; [ -s \"$NVM_DIR/nvm.sh\" ] && . \"$NVM_DIR/nvm.sh\"; command -v npm >/dev/null && npm cache verify || true'"
"pyenv rehash" = "bash -lc 'command -v pyenv >/dev/null && pyenv rehash || true'"
"go clean test cache" = "bash -lc 'command -v go >/dev/null && go clean -testcache || true'"
"Refresh zsh completions" = "bash -lc 'rm -f \"$HOME\"/.zcompdump* 2>/dev/null || true'"

[brew]
greedy_cask = true
autoremove = true
